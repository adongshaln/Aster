<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  /* ── 宿主主题变量：原版 custom_css 里 rig / gen-timer 用到的最小集 ── */
  :root {
    --cl-ink: #121212;
    --cl-clawd-eye: #000000;
    --cl-sans: system-ui, -apple-system, sans-serif;
    --cw-text-body: #37362f;
    --cw-surface-raised: #ffffff;
    --cw-rule-hairline: rgba(31,31,30,.15);
    --cw-mark: #c6613f;
  }
  html[data-claude-integrated-theme="night"] {
    --cl-ink: #f8f8f6;
    --cw-text-body: #c3c2b7;
    --cw-surface-raised: #2c2c2a;
    --cw-rule-hairline: rgba(226,225,218,.15);
    --cw-mark: #e6a58c;
  }
  /* ── 镜像 DOM：#send_form 是真实输入框的锚（位置由宿主同步）。
     #send_textarea / #chat 是给原版代码读状态的替身（透明、只读、不接管键盘）。 ── */
  #send_form { position: absolute; }
  /* 用户校准「下降大约一毫米」：原版 .clawd-pile 自带 margin-bottom:-1px（≈0.26mm），
     这里覆盖为 -5px，净再降 4 CSS px ≈ 1mm。 */
  html .clawd-pile { margin-bottom: -5px !important; }
  #send_textarea {
    position: absolute; left: 0; top: 0; width: 1px; height: 1px;
    opacity: 0; pointer-events: none; border: 0; padding: 0; margin: 0;
    resize: none; outline: 0;
  }
  #sheld { position: absolute; left: 0; top: 0; width: 0; height: 0; overflow: hidden; visibility: hidden; }
  #chat .mes_text { visibility: hidden; }
  /* ── 大 Clawd 按钮：原版 button.clawd-signoff-button 基础外观（2.0.135，42x34） ── */
  button.clawd-signoff-button {
    appearance: none !important;
    -webkit-appearance: none !important;
    -webkit-tap-highlight-color: transparent !important;
    position: relative !important;
    isolation: isolate !important;
    display: block !important;
    box-sizing: border-box !important;
    width: 42px !important;
    min-width: 42px !important;
    max-width: 42px !important;
    height: 34px !important;
    min-height: 34px !important;
    max-height: 34px !important;
    margin: 14px 0 1px !important;
    padding: 0 !important;
    overflow: visible !important;
    color: transparent !important;
    background-color: transparent !important;
    background-image: none !important;
    background-repeat: no-repeat !important;
    background-position: left bottom !important;
    background-size: 42px 42px !important;
    border: 0 !important;
    border-radius: 0 !important;
    outline: 0 !important;
    box-shadow: none !important;
    filter: none;
    cursor: pointer !important;
    image-rendering: pixelated;
    line-height: 0 !important;
    transform: translateY(0) scale(1) rotate(0);
    transform-origin: center bottom;
    transition: transform 150ms cubic-bezier(.2,.8,.25,1.25), filter 150ms ease !important;
  }
  button.clawd-signoff-button:hover { filter: saturate(1.08); }
  /* composer 大 Clawd：钉在 #send_form 内。原版底边 calc(100% - 1px) 与小爪
     bottom:100%+margin-bottom:-1px 等价（并排同一条线）；本宿主把小爪净降到
     -5px（下降 1mm 校准），这里同步 -5px 保持同线。 */
  html body #send_form > button.clawd-signoff-button.clawd-composer-clawd {
    position: absolute !important;
    inset: auto auto calc(100% - 5px) max(18px, calc(env(safe-area-inset-left, 0px) + 12px)) !important;
    z-index: 4 !important;
    display: block !important;
    margin: 0 !important;
    touch-action: none !important;
  }
  /* 生成计时徽标（原版 .clawd-gen-timer，色值取自日/夜主题变量） */
  .clawd-gen-timer {
    position: fixed;
    right: 16px;
    bottom: 84px;
    z-index: 10015;
    padding: 4px 10px;
    border-radius: 10px;
    font-family: var(--cl-sans);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: var(--cw-text-body);
    background: var(--cw-surface-raised);
    border: 1px solid var(--cw-rule-hairline);
    box-shadow: 0 6px 18px rgba(0,0,0,.18);
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 200ms ease, transform 200ms ease;
    pointer-events: none;
  }
  .clawd-gen-timer.clawd-gen-timer-visible { opacity: .92; transform: translateY(0); }
  .clawd-gen-timer.clawd-gen-timer-done { color: var(--cw-mark); }
</style>
</head>

function renderClawdTracks() {
  const visible = clawdVisibleState();

  const generationInFlight = clawdTracks.A === 'think' || clawdTracks.A === 'stream' || clawdTracks.A === 'sit';
  clawdVisualNodes().forEach(button => {
    const isComposer = button.classList.contains('clawd-composer-clawd');

      clawdA: clawdTracks.A || '',

    const display = isComposer || !generationInFlight ? 'block' : 'none';
    button.style.getPropertyValue('display') === display && button.style.getPropertyPriority('display') === 'important' || button.style.setProperty('display', display, 'important');

function installClawdRigStyle() {
  doc.getElementById(CLAWD_RIG_STYLE_ID)?.remove();
  const RB = `#send_form > button.${BUTTON_CLASS}.clawd-composer-clawd`;
  const style = doc.createElement('style');
  style.id = CLAWD_RIG_STYLE_ID;
  style.textContent = `
      ${RB} > .clawd-rig { display: none; position: absolute; left: -4px; top: -14px; width: 3px; height: 3px;
        transform-origin: 24px 48px; pointer-events: none; }
      ${RB}[data-clawd-rig="on"] > .clawd-rig { display: block; }
      ${RB} .clr-root { position: absolute; left: 0; top: 0; }
      ${RB} .clr-p { position: absolute; left: 0; top: 0; width: 3px; height: 3px; }
      @media (prefers-reduced-motion: reduce) {
        ${RB} .clawd-rig, ${RB} .clawd-rig * { animation: none !important; }
      }
    ` + CLAWD_RIG.css;
  doc.head.append(style);
  clawdRigSchedulePrewarm();
}
const CLAWD_RIG_PREWARM = ['press', 'grab', 'drag', 'dragSwing', 'fly', 'land', 'stomp', 'stompSlap', 'pet', 'poke1', 'poke1Shy', 'poke2', 'poke3', 'poke4', 'rage'];
let clawdRigPrewarmTimer = 0;
let clawdRigPrewarmIsIdle = false;
function clawdRigSchedulePrewarm() {
  if (clawdRigPrewarmTimer) return;
  const run = () => {
    clawdRigPrewarmTimer = 0;
    const style = doc.getElementById(CLAWD_RIG_STYLE_ID);
    if (!style) return;
    const composer = composerClawd();
    composer && clawdRigGhostHostFor(composer);
    const ids = CLAWD_RIG_PREWARM.filter(id => CLAWD_RIG.clips[id]).flatMap(id => [id, id + '-m']).filter(id => !clawdRigInjected.has(id));
    if (!ids.length) return;
    style.append(doc.createTextNode(ids.map(id => CLAWD_RIG.cssFor(id)).join('\n')));
    ids.forEach(id => clawdRigInjected.add(id));
  };
  clawdRigPrewarmIsIdle = typeof win.requestIdleCallback === 'function';

}
function ensureClawdRigClipCss(id) {
  if (clawdRigInjected.has(id)) return;
  const style = doc.getElementById(CLAWD_RIG_STYLE_ID);
  if (!style) return;
  style.append(doc.createTextNode(CLAWD_RIG.cssFor(id)));

}

    w: meal && item.mealWeight ? item.mealWeight : item.weight
  }));
  const total = ok.reduce((sum, item) => sum + item.w, 0);
  if (!total) return null;
  let roll = Math.random() * total;
  for (const item of ok) if ((roll -= item.w) <= 0) return item.id;
  return ok[ok.length - 1].id;
}

/* ═══════════ 宿主桥入口（Kotlin evaluateJavascript 调这些） ═══════════ */

/* #send_form 定位（物理 px） */
function layoutForm(x, y, w, h) {
  const dpr = win.devicePixelRatio || 1;
  const f = doc.getElementById('send_form');
  f.style.left = (x / dpr) + 'px';
  f.style.top = (y / dpr) + 'px';
  f.style.width = (w / dpr) + 'px';
  f.style.height = (h / dpr) + 'px';
  bridge.formRect = { x, y, w, h };
  const oldW = bridge.lastFormW || 0;
  bridge.lastFormW = w;
  if (oldW && w !== oldW && oldW > 0) clawdShiftWithForm((w - oldW) / dpr / 2);
  bridge.pileAPI?.restack();
  reportRects();
}

/* 聊天区矩形（物理 px）→ #sheld 定位 + A2 边界过期 */
function layoutChat(x, y, w, h) {
  const dpr = win.devicePixelRatio || 1;
  const s = doc.getElementById('sheld');
  s.style.left = (x / dpr) + 'px';
  s.style.top = (y / dpr) + 'px';
  s.style.width = (w / dpr) + 'px';
  s.style.height = (h / dpr) + 'px';
  bridge.chatRect = { x, y, w, h };
  A2.bndReady = false;
}

/* 输入框文本/焦点 → 镜像 textarea + 合成 beforeinput/input 事件 */
function syncInput(text) {
  const box = doc.getElementById('send_textarea');
  if (!box) return;
  if (box.value !== text) {
    const longer = text.length > box.value.length;
    const type = longer ? (text.length - box.value.length > 3 ? 'insertFromPaste' : 'insertText') : 'deleteContentBackward';
    try {
      box.dispatchEvent(new InputEvent('beforeinput', { bubbles: true, cancelable: true, inputType: type }));
    } catch (e) {
      box.dispatchEvent(new Event('beforeinput', { bubbles: true }));
    }
    box.value = text;
    try {
      box.dispatchEvent(new InputEvent('input', { bubbles: true, inputType: type }));
    } catch (e) {
      box.dispatchEvent(new Event('input', { bubbles: true }));
    }
    box.selectionStart = box.selectionEnd = text.length;
  }
}

/* 生成状态：active=有 isStreaming 的消息；hasText=最后一条已出字；!active 时 outcome 收尾 */
function syncGeneration(active, hasText, outcome) {
  const wasActive = generationEventActive;
  if (active && !wasActive) {
    generationEventActive = true;
    setGeneratingFlag(true);
    startGenTimer();
    beginClawdGeneration();
    return;
  }
  if (active && hasText && clawdTracks.A === 'think') {
    setClawdA('stream');
    return;
  }
  if (!active && wasActive) {
    generationEventActive = false;
    setGeneratingFlag(false);
    stopGenTimer();
    settleClawdGeneration(outcome || 'done');
  }
}

/* 最后一条 assistant 消息文本 → 镜像 .mes_text（write 倍速跟出字） */
function syncLastText(text) {
  const el = doc.querySelector('#chat > .mes.last_mes .mes_text');
  if (el && el.textContent !== text) el.textContent = text;
}

/* 用户滚动 → peek */
function onScroll() {
  clawdScrollTilt();
}

/* 输入框焦点变化（compose 状态与蹲字动画靠 focused+text 判定） */
function syncFocus(focused) {
  const box = doc.getElementById('send_textarea');
  if (!box) return;
  if (focused && doc.activeElement !== box) {
    try { box.focus({ preventScroll: true }); } catch (e) { box.focus(); }
  } else if (!focused && doc.activeElement === box) box.blur();
  syncClawdBState();
}

/* 爪子屏幕矩形汇报（含大 Clawd 按钮） */
function reportRects() {
  const dpr = win.devicePixelRatio || 1;
  const out = [];
  if (bridge.pile) {
    doc.querySelectorAll('.clawd-pile-c').forEach(el => {
      const r = el.getBoundingClientRect();
      if (r.width > 0) out.push([r.left * dpr, r.top * dpr, r.right * dpr, r.bottom * dpr]);
    });
  }
  const big = composerClawd();
  if (big) {
    const r = big.getBoundingClientRect();
    if (r.width > 0) out.push([r.left * dpr, r.top * dpr, r.right * dpr, r.bottom * dpr]);
  }
  bridge.rects = out;
  if (win.AsterClawd) { try { win.AsterClawd.pushRects(JSON.stringify(out)); } catch (e) {} }
}
function startReporting() {
  if (bridge.reportTimer) return;
  bridge.reportTimer = win.setInterval(reportRects, 60);
  win.addEventListener('resize', reportRects);
}

/* ── 初始化 ── */
function init() {
  try {
    if (typeof createClawdPile !== 'function') { console.error('clawd-host: createClawdPile 未定义'); return; }
    if (typeof buildClawdRig !== 'function') { console.error('clawd-host: buildClawdRig 未定义'); return; }
    // 原版 makeClawdPile（index.js 1365）：big 只暴露 state/lower 两个方法
    const bigApi = {
      state: () => ({
        grounded: !A2.held && Math.abs(A2.fy - A2.floor) < .5,
        walking: /^rig:walkLoop/.test(String(clawdTracks.B || ''))
      }),
      lower: () => clawdBigLower()
    };
    bridge.pile = createClawdPile({ doc, win, big: bigApi });
    bridge.pileAPI = bridge.pile;   // pile 返回值就是 { ensure, peek, seats, blocks, ... }
    installClawdRigStyle();
    ensureComposerClawd();
    const el = bridge.pile.ensure();
    if (!el) { console.error('clawd-host: ensure() 返回 null（#send_form 未找到）'); return; }
    renderClawdTracks();
    clawdLastIdleTickAt = Date.now();
    clawdRuntimeTimer = win.setInterval(clawdRuntimeTick, 200);
    bridge.rhythm = installClawdRhythm({
      doc, win,
      button: composerClawd,
      enabled: () => true,
      reducedMotion: clawdPrefersReducedMotion
    });
    startReporting();
    console.log('clawd-host: ready,', doc.querySelectorAll('.clawd-pile-c').length, '只小爪子 + 大 Clawd, clips:', Object.keys(CLAWD_RIG.clips).length);
  } catch (e) {
    console.error('clawd-host init:', e && e.message, e && e.stack);
  }
}

/* 原版事件监听（index.js 7039-7040）：composer 编辑反应 + noteActivity */
for (const type of ['beforeinput', 'compositionstart', 'compositionend']) doc.addEventListener(type, handleClawdComposerEdit, true);
doc.addEventListener('input', handleClawdComposerInput, true);

/* Android 侧 evaluateJavascript 调这些全局函数 */
win.__clawdLayout = layoutForm;
win.__clawdChat = layoutChat;
win.__clawdInput = syncInput;
win.__clawdFocus = syncFocus;
win.__clawdGen = syncGeneration;
win.__clawdLastText = syncLastText;
win.__clawdScroll = onScroll;
win.__clawdHit = (x, y) => bridge.rects.some(([l, t, r, b]) => x >= l && x < r && y >= t && y < b);
win.__clawdRects = () => JSON.stringify(bridge.rects);
win.__clawdNight = on => {
  doc.documentElement.setAttribute('data-claude-integrated-theme', on ? 'night' : '');
};

win.addEventListener('error', e => console.error('clawd-host:', e.message, e.filename, e.lineno));

if (doc.readyState === 'loading') doc.addEventListener('DOMContentLoaded', init);
else init();
</script>
