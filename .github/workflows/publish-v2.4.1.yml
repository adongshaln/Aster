name: Publish Aster v2.4.1

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/publish-v2.4.1.yml"

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create v2.4.1 tag on verified release commit
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_SHA="285081d602bfaa373ebc93ad5a1e9aa9e3fbe779"
          git cat-file -e "${RELEASE_SHA}^{commit}"
          if git ls-remote --exit-code --tags origin refs/tags/v2.4.1 >/dev/null 2>&1; then
            test "$(git ls-remote --tags origin refs/tags/v2.4.1 | awk '{print $1}')" = "${RELEASE_SHA}"
          else
            git tag v2.4.1 "${RELEASE_SHA}"
            git push origin refs/tags/v2.4.1
          fi

      - name: Dispatch signed release build on tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android-build.yml --ref v2.4.1

      - name: Remove temporary publisher from main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-v2.4.1.yml
          git commit -m "ci: remove temporary v2.4.1 publisher"
          git push origin HEAD:main
