name: Apply Skill loop fix

on:
  push:
    branches: [feature/skills-runtime]
    paths: [.github/workflows/apply-skill-loop-fix.yml]

permissions:
  contents: write
  actions: write

concurrency:
  group: apply-skill-loop-fix
  cancel-in-progress: false

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Apply recovered patch and final refinements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path

          patch = gzip.decompress(base64.b64decode(Path(".github/aster-bootstrap/fix.patch.gz.b64").read_text().strip()))
          expected = "89b57b1eedbfd5df5d3a540dc38f04459fa9076a60a2564e836e625b82234917"
          actual = hashlib.sha256(patch).hexdigest()
          if actual != expected:
              raise SystemExit(f"patch checksum mismatch: {actual} != {expected}")
          Path("/tmp/fix.patch").write_bytes(patch)

          script = gzip.decompress(base64.b64decode(Path(".github/aster-bootstrap/complete.py.gz.b64").read_text().strip()))
          Path("/tmp/complete.py").write_bytes(script)
          PY
          git apply --check /tmp/fix.patch
          git apply /tmp/fix.patch
          python3 /tmp/complete.py
          git diff --check
          git status --short

      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Commit final code and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/aster-bootstrap
          rm -f .github/workflows/apply-skill-loop-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: stabilize skill tool loop and dependency ordering"
          git push origin HEAD:feature/skills-runtime

      - name: Start normal Android release build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android-build.yml --ref feature/skills-runtime
