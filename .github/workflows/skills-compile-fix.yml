name: Fix skills runtime compile

on:
  push:
    branches: ["feature/skills-runtime"]
    paths: [".github/workflows/skills-compile-fix.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/skills-runtime
      - name: Patch visibility and chat status
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/adong/adchat/data/ApiRepository.kt')
          s = p.read_text()
          old = 'class ApiRepository(private val skillLoader: SkillLoader = GitHubSkillRuntime) {'
          new = '''class ApiRepository {
    private val skillLoader: SkillLoader

    constructor() {
        skillLoader = GitHubSkillRuntime
    }

    internal constructor(skillLoader: SkillLoader) {
        this.skillLoader = skillLoader
    }'''
          if s.count(old) != 1:
              raise SystemExit('ApiRepository constructor shape changed unexpectedly')
          s = s.replace(old, new, 1)
          old_status = 'if (profile.webSearchEnabled) recordActivity(ChatToolActivity("web_search", WEB_SEARCH_TOOL, "正在搜索网页", TOOL_STATUS_RUNNING))'
          new_status = 'if (profile.webSearchEnabled && !skillLoadingEnabled) recordActivity(ChatToolActivity("web_search", WEB_SEARCH_TOOL, "正在搜索网页", TOOL_STATUS_RUNNING))'
          if s.count(old_status) != 1:
              raise SystemExit(f'Expected one chat web-search start marker, got {s.count(old_status)}')
          s = s.replace(old_status, new_status, 1)
          old_done = 'if (profile.webSearchEnabled) recordActivity(ChatToolActivity("web_search", WEB_SEARCH_TOOL, "已完成网页搜索", TOOL_STATUS_COMPLETED))'
          new_done = 'if (profile.webSearchEnabled && !skillLoadingEnabled) recordActivity(ChatToolActivity("web_search", WEB_SEARCH_TOOL, "已完成网页搜索", TOOL_STATUS_COMPLETED))'
          if s.count(old_done) != 1:
              raise SystemExit(f'Expected one chat web-search completion marker, got {s.count(old_done)}')
          s = s.replace(old_done, new_done, 1)
          p.write_text(s)
          PY
      - name: Commit fix
        shell: bash
        run: |
          rm .github/workflows/skills-compile-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/adong/adchat/data/ApiRepository.kt .github/workflows/skills-compile-fix.yml
          git commit -m "fix(skills): keep loader injection internal"
          git push origin HEAD:feature/skills-runtime
