name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and assemble unsigned release
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Stage signing inputs
        run: |
          mkdir -p ci-output
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            ci-output/Aster-v2.0.0-unsigned-aligned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" ci-output/apksigner.jar

      - name: Upload unsigned build
        uses: actions/upload-artifact@v4
        with:
          name: aster-release-unsigned
          path: ci-output/
          if-no-files-found: error
          retention-days: 7
