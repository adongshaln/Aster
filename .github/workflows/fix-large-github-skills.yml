name: Fix large GitHub Skill loading

on:
  push:
    branches: [feature/skills-runtime]
    paths:
      - .github/workflows/fix-large-github-skills.yml
      - .github/scripts/fix-large-github-skills.py

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: feature/skills-runtime
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Apply migration
        run: python3 .github/scripts/fix-large-github-skills.py

      - name: Validate diff
        run: |
          git diff --check
          git status --short

      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Commit final source
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-large-github-skills.yml
          rm .github/scripts/fix-large-github-skills.py
          rmdir .github/scripts 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: load large GitHub skills lazily"
          git push origin HEAD:feature/skills-runtime
