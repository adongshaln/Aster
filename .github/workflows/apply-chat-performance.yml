name: Apply chat performance optimizations

on:
  push:
    branches:
      - fix/icon-ime-collapse
    paths:
      - .github/workflows/apply-chat-performance.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/icon-ime-collapse
          fetch-depth: 0

      - name: Optimize chat rendering
        shell: bash
        run: |
          printf '%s' '' | base64 --decode > /tmp/chat_perf_patch.py
          python3 /tmp/chat_perf_patch.py

      - name: Commit performance changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/adong/adchat/ui/screens/ChatScreen.kt
          git commit -m "Optimize chat rendering performance"
          git push origin HEAD:fix/icon-ime-collapse
