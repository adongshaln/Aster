name: Expose remote Skill file manifests

on:
  push:
    branches: [feature/skills-runtime]
    paths:
      - .github/workflows/expose-remote-skill-files.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: feature/skills-runtime
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Apply manifest fix
        run: python3 .github/scripts/expose-remote-skill-files.py

      - name: Validate diff
        run: git diff --check

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Commit final source
        shell: bash
        run: |
          rm .github/scripts/expose-remote-skill-files.py
          rm .github/workflows/expose-remote-skill-files.yml
          git add app/src/main/java/com/adong/adchat/data/ToolProtocol.kt \
                  app/src/test/java/com/adong/adchat/data/SkillRuntimeTest.kt \
                  .github/scripts/expose-remote-skill-files.py \
                  .github/workflows/expose-remote-skill-files.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: expose lazy Skill file manifests"
          git push origin HEAD:feature/skills-runtime
