name: Fix skills runtime visibility

on:
  push:
    branches: ["feature/skills-runtime"]
    paths: [".github/workflows/fix-skills-visibility.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/skills-runtime
      - name: Patch visibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/adong/adchat/data/ApiRepository.kt')
          s = p.read_text()
          old = 'class ApiRepository(private val skillLoader: SkillLoader = GitHubSkillRuntime) {'
          new = 'class ApiRepository internal constructor(private val skillLoader: SkillLoader = GitHubSkillRuntime) {'
          if s.count(old) != 1:
              raise SystemExit(f'expected one constructor anchor, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        shell: bash
        run: |
          rm .github/workflows/fix-skills-visibility.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/adong/adchat/data/ApiRepository.kt .github/workflows/fix-skills-visibility.yml
          git commit -m "fix(skills): keep runtime injection internal"
          git push origin HEAD:feature/skills-runtime
