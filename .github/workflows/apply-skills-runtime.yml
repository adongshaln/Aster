name: Apply skills runtime integration

on:
  push:
    branches: ["feature/skills-runtime"]
    paths:
      - "tools/apply_skills_runtime.py"
      - ".github/workflows/apply-skills-runtime.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/skills-runtime
          fetch-depth: 0
      - name: Apply integration patch
        run: python tools/apply_skills_runtime.py
      - name: Remove one-off patch machinery
        run: |
          rm tools/apply_skills_runtime.py
          rm .github/workflows/apply-skills-runtime.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add real GitHub skills runtime"
          git push origin HEAD:feature/skills-runtime
