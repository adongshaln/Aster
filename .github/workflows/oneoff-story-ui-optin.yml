name: One-off story UI opt-in fix

on:
  push:
    branches: [feature/story-mode]
    paths: [.github/workflows/oneoff-story-ui-optin.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/story-mode
          fetch-depth: 0
      - name: Add Material3 opt-in
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/adong/adchat/ui/screens/StoryScreen.kt')
          s = p.read_text()
          old = '@OptIn(ExperimentalLayoutApi::class)\n@Composable\nprivate fun StoryComposer('
          new = '@OptIn(ExperimentalLayoutApi::class, ExperimentalMaterial3Api::class)\n@Composable\nprivate fun StoryComposer('
          if old not in s:
              raise SystemExit('StoryComposer opt-in target not found')
          p.write_text(s.replace(old, new, 1))
          PY

          rm .github/workflows/oneoff-story-ui-optin.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/adong/adchat/ui/screens/StoryScreen.kt .github/workflows/oneoff-story-ui-optin.yml
          git commit -m "fix(story): opt in attachment bottom sheet"
          git push origin HEAD:feature/story-mode
