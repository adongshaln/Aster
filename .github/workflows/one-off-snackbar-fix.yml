name: One-off snackbar fix

on:
  push:
    branches:
      - design/reading-experience
    paths:
      - .github/workflows/one-off-snackbar-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/reading-experience
      - name: Patch transient notices
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("app/src/main/java/com/adong/adchat/MainActivity.kt")
          text = path.read_text(encoding="utf-8")

          effect_pattern = re.compile(
              r'(?ms)^\s{4}LaunchedEffect\(vm\.notice\) \{\n.*?^\s{4}\}\n\n(?=\s{4}ModalNavigationDrawer)'
          )
          new_effect = '''    LaunchedEffect(vm.notice) {
              vm.notice?.let { message ->
                  // Consume immediately so the same notice cannot be replayed while visible.
                  vm.dismissNotice()
                  // A newer notice replaces the old one instead of waiting behind it.
                  snackbarHostState.currentSnackbarData?.dismiss()
                  snackbarHostState.showSnackbar(
                      message = message,
                      duration = SnackbarDuration.Short
                  )
              }
          }

          '''
          text, count = effect_pattern.subn(new_effect, text, count=1)
          if count != 1:
              raise SystemExit(f"notice effect patch count={count}")

          scaffold_pattern = re.compile(
              r'(?ms)^\s{8}Scaffold\(\n\s{12}containerColor = Canvas,\n\s{12}snackbarHost = \{.*?^\s{8}\) \{ padding ->'
          )
          new_scaffold = '''        Scaffold(
              containerColor = Canvas
          ) { padding ->'''
          text, count = scaffold_pattern.subn(new_scaffold, text, count=1)
          if count != 1:
              raise SystemExit(f"scaffold snackbar patch count={count}")

          marker = '''                }
              }
          }
      }
  }
}

@Composable
private fun AppDrawer'''
          host = '''
              SnackbarHost(
                  hostState = snackbarHostState,
                  modifier = Modifier
                      .align(Alignment.TopCenter)
                      .statusBarsPadding()
                      .padding(top = 66.dp, start = 16.dp, end = 16.dp)
                      .widthIn(max = 640.dp)
              ) { data ->
                  Snackbar(
                      containerColor = Night,
                      contentColor = Color.White,
                      shape = RoundedCornerShape(14.dp),
                      modifier = Modifier
                          .fillMaxWidth()
                          .clickable { data.dismiss() }
                  ) {
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Text(
                              text = data.visuals.message,
                              modifier = Modifier.weight(1f),
                              style = MaterialTheme.typography.bodyMedium,
                              fontWeight = FontWeight.SemiBold
                          )
                          Spacer(Modifier.width(12.dp))
                          Icon(
                              Icons.Rounded.Close,
                              contentDescription = "关闭提示",
                              modifier = Modifier.size(18.dp),
                              tint = Color.White.copy(alpha = .82f)
                          )
                      }
                  }
              }
          '''
          if marker not in text:
              # Match the actual indentation emitted by the Kotlin source without depending on YAML indentation.
              marker_pattern = re.compile(
                  r'(?m)(^\s{16}\}\n)(\s{12}\}\n\s{8}\}\n\s{4}\}\n\}\n\n@Composable\nprivate fun AppDrawer)'
              )
              text, count = marker_pattern.subn(lambda m: m.group(1) + host + m.group(2), text, count=1)
              if count != 1:
                  raise SystemExit(f"snackbar host insertion count={count}")
          else:
              text = text.replace(marker, marker.replace('                }\n', '                }\n' + host, 1), 1)

          path.write_text(text, encoding="utf-8")
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/adong/adchat/MainActivity.kt
          git commit -m "Move transient notices away from the composer"
          git push origin HEAD:design/reading-experience
