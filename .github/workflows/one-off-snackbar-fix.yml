name: One-off snackbar fix

on:
  push:
    branches:
      - design/reading-experience
    paths:
      - .github/workflows/one-off-snackbar-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/reading-experience
      - name: Patch transient notices
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/src/main/java/com/adong/adchat/MainActivity.kt")
          lines = path.read_text(encoding="utf-8").splitlines()

          effect_start = lines.index("    LaunchedEffect(vm.notice) {")
          modal_start = lines.index("    ModalNavigationDrawer(", effect_start)
          effect = [
              "    LaunchedEffect(vm.notice) {",
              "        vm.notice?.let { message ->",
              "            vm.dismissNotice()",
              "            snackbarHostState.currentSnackbarData?.dismiss()",
              "            snackbarHostState.showSnackbar(",
              "                message = message,",
              "                duration = SnackbarDuration.Short",
              "            )",
              "        }",
              "    }",
              "",
          ]
          lines[effect_start:modal_start] = effect

          scaffold_start = lines.index("        Scaffold(")
          padding_line = lines.index("        ) { padding ->", scaffold_start)
          lines[scaffold_start:padding_line + 1] = [
              "        Scaffold(",
              "            containerColor = Canvas",
              "        ) { padding ->",
          ]

          settings_line = lines.index("                        AppPage.Settings -> SettingsScreen(vm, onOpenDrawer = openDrawer)")
          animated_end = next(i for i in range(settings_line + 1, len(lines)) if lines[i] == "                }")
          host = [
              "                SnackbarHost(",
              "                    hostState = snackbarHostState,",
              "                    modifier = Modifier",
              "                        .align(Alignment.TopCenter)",
              "                        .statusBarsPadding()",
              "                        .padding(top = 66.dp, start = 16.dp, end = 16.dp)",
              "                        .widthIn(max = 640.dp)",
              "                ) { data ->",
              "                    Snackbar(",
              "                        containerColor = Night,",
              "                        contentColor = Color.White,",
              "                        shape = RoundedCornerShape(14.dp),",
              "                        modifier = Modifier",
              "                            .fillMaxWidth()",
              "                            .clickable { data.dismiss() }",
              "                    ) {",
              "                        Row(",
              "                            modifier = Modifier.fillMaxWidth(),",
              "                            verticalAlignment = Alignment.CenterVertically",
              "                        ) {",
              "                            Text(",
              "                                text = data.visuals.message,",
              "                                modifier = Modifier.weight(1f),",
              "                                style = MaterialTheme.typography.bodyMedium,",
              "                                fontWeight = FontWeight.SemiBold",
              "                            )",
              "                            Spacer(Modifier.width(12.dp))",
              "                            Icon(",
              "                                Icons.Rounded.Close,",
              "                                contentDescription = \"关闭提示\",",
              "                                modifier = Modifier.size(18.dp),",
              "                                tint = Color.White.copy(alpha = .82f)",
              "                            )",
              "                        }",
              "                    }",
              "                }",
          ]
          lines[animated_end + 1:animated_end + 1] = host

          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/adong/adchat/MainActivity.kt
          git commit -m "Move transient notices away from the composer"
          git push origin HEAD:design/reading-experience
