name: One-off compile fix

on:
  push:
    branches:
      - design/reading-experience
    paths:
      - .github/workflows/one-off-compile-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/reading-experience
      - name: Repair malformed newlines
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/src/main/java/com/adong/adchat/ui/screens/ChatScreen.kt")
          text = path.read_text(encoding="utf-8")
          old = r'''    // Keep the bottom reading veil visually stable; the live Haze path rendered differently\n    // between idle and touch/scroll states on some Android GPUs.\n    val useLiveHaze = false'''
          new = '''    // Keep the bottom reading veil visually stable; the live Haze path rendered differently
              // between idle and touch/scroll states on some Android GPUs.
              val useLiveHaze = false'''
          if old not in text:
              raise SystemExit("malformed haze declaration not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/adong/adchat/ui/screens/ChatScreen.kt
          git commit -m "Repair fixed reading veil declaration"
          git push origin HEAD:design/reading-experience
