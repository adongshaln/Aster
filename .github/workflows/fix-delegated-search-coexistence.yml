name: Fix delegated search coexistence

on:
  push:
    paths:
      - '.github/workflows/fix-delegated-search-coexistence.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: fix/delegated-search-coexistence
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply focused coexistence fix
        run: python .github/scripts/fix-delegated-search-coexistence.py
      - name: Check patch
        run: git diff --check
      - name: Run delegated search tests
        run: ./gradlew --no-daemon testDebugUnitTest --tests 'com.adong.adchat.data.DelegatedSearchTest' --tests 'com.adong.adchat.data.DelegatedSearchIntegrationTest'
      - name: Run full unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java app/src/test/java
          git commit -m 'fix: preserve delegated search tool coexistence'
          git push origin HEAD:fix/delegated-search-coexistence
