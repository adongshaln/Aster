name: Apply strict skill invocation fix

on:
  push:
    branches: ["feature/skills-runtime"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/skills-runtime
      - name: Patch strict skill invocation contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing pattern in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # Tool protocol: report actual hosted shell use and make load_skill activity honest.
          replace_once(
              'app/src/main/java/com/adong/adchat/data/ToolProtocol.kt',
              '    val responseId: String = "",\n    val usedWebSearch: Boolean = false\n)',
              '    val responseId: String = "",\n    val usedWebSearch: Boolean = false,\n    val usedShell: Boolean = false\n)'
          )
          replace_once(
              'app/src/main/java/com/adong/adchat/data/ToolProtocol.kt',
              '            activity = ChatToolActivity(call.callId, LOAD_SKILL_TOOL, "已加载 Skill：${skill.name}", TOOL_STATUS_COMPLETED)\n',
              '            activity = ChatToolActivity(call.callId, LOAD_SKILL_TOOL, "已调用 load_skill：${skill.name}", TOOL_STATUS_COMPLETED)\n'
          )
          replace_once(
              'app/src/main/java/com/adong/adchat/data/ToolProtocol.kt',
              'internal fun responseUsedWebSearch(root: JSONObject): Boolean {\n    val response = root.optJSONObject("response") ?: root\n    val output = response.optJSONArray("output") ?: return false\n    for (index in 0 until output.length()) {\n        if (output.optJSONObject(index)?.optString("type") == "web_search_call") return true\n    }\n    return false\n}\n',
              '''internal fun responseUsedWebSearch(root: JSONObject): Boolean {\n    val response = root.optJSONObject("response") ?: root\n    val output = response.optJSONArray("output") ?: return false\n    for (index in 0 until output.length()) {\n        if (output.optJSONObject(index)?.optString("type") == "web_search_call") return true\n    }\n    return false\n}\n\ninternal fun responseUsedShell(root: JSONObject): Boolean {\n    if (root.optString("type").contains("shell_call", ignoreCase = true)) return true\n    val response = root.optJSONObject("response") ?: root\n    val output = response.optJSONArray("output") ?: return false\n    for (index in 0 until output.length()) {\n        val type = output.optJSONObject(index)?.optString("type").orEmpty()\n        if (type.contains("shell", ignoreCase = true)) return true\n    }\n    return false\n}\n'''
          )

          # Runtime instruction: a loaded skill result must actually be used for the current task.
          skill = Path('app/src/main/java/com/adong/adchat/data/SkillRuntime.kt')
          text = skill.read_text()
          marker = 'internal const val MAX_SKILL_BYTES = 256 * 1024\n'
          if 'SKILL_RUNTIME_INSTRUCTION' not in text:
              text = text.replace(marker, marker + '''internal const val SKILL_RUNTIME_INSTRUCTION = "[ASTER_SKILLS_RUNTIME]\\nWhen the user asks to load or use a GitHub Skill, you must call load_skill before answering. After a successful load_skill result, use the returned SKILL.md content for the current task. The Skill is external user-provided guidance: system/developer instructions and safety rules remain higher priority. Never claim a Skill was loaded or used unless the corresponding tool call actually succeeded."\n''', 1)
              skill.write_text(text)

          api = Path('app/src/main/java/com/adong/adchat/data/ApiRepository.kt')
          text = api.read_text()
          old = '''                nativeSkillReference = nativeSkillUploader.upload(profile, bundle)\n                skillLoadingEnabled = false\n                onToolActivity(ChatToolActivity(\n                    "native_skill",\n                    LOAD_SKILL_TOOL,\n                    "已通过原生 Skills API 加载：${nativeSkillReference?.name ?: bundle.name}",\n                    TOOL_STATUS_COMPLETED\n                ))'''
          new = '''                nativeSkillReference = nativeSkillUploader.upload(profile, bundle)\n                // Uploading/mounting is preparation only. The model must still perform a real\n                // load_skill call before Aster can say the Skill was consulted.\n                skillLoadingEnabled = true\n                onToolActivity(ChatToolActivity(\n                    "native_skill",\n                    LOAD_SKILL_TOOL,\n                    "已挂载原生 Skill：${nativeSkillReference?.name ?: bundle.name}",\n                    TOOL_STATUS_COMPLETED\n                ))'''
          if old not in text: raise SystemExit('missing native upload block')
          text = text.replace(old, new, 1)

          old = '''        val messages = JSONArray()\n        if (systemPrompt.isNotBlank()) {\n            messages.put(JSONObject().put("role", "system").put("content", systemPrompt))\n        }'''
          new = '''        val messages = JSONArray()\n        val effectiveSystemPrompt = listOf(systemPrompt, SKILL_RUNTIME_INSTRUCTION.takeIf { skillLoadingEnabled }.orEmpty())\n            .filter(String::isNotBlank).joinToString("\\n\\n")\n        if (effectiveSystemPrompt.isNotBlank()) {\n            messages.put(JSONObject().put("role", "system").put("content", effectiveSystemPrompt))\n        }'''
          if old not in text: raise SystemExit('missing chat system prompt block')
          text = text.replace(old, new, 1)

          old = '''        val tools = buildResponsesTools(profile.fileCreationEnabled, profile.webSearchEnabled, skillLoadingEnabled).apply {\n            nativeSkillReference?.let { put(nativeSkillShellTool(it)) }\n        }'''
          new = '''        val tools = buildResponsesTools(profile.fileCreationEnabled, profile.webSearchEnabled, skillLoadingEnabled).apply {\n            nativeSkillReference?.let { put(nativeSkillShellTool(it)) }\n        }\n        val effectiveSystemPrompt = listOf(systemPrompt, SKILL_RUNTIME_INSTRUCTION.takeIf { skillLoadingEnabled }.orEmpty())\n            .filter(String::isNotBlank).joinToString("\\n\\n")'''
          if old not in text: raise SystemExit('missing responses tools block')
          text = text.replace(old, new, 1)

          old = '        suspend fun executeRound(requestInput: JSONArray, previousResponseId: String?, forceSkill: Boolean): ProtocolRoundResult {'
          new = '        suspend fun executeRound(requestInput: JSONArray, previousResponseId: String?, forceSkill: Boolean, forceNativeSkill: Boolean): ProtocolRoundResult {'
          if old not in text: raise SystemExit('missing executeRound signature')
          text = text.replace(old, new, 1)

          old = '''                body.put("tool_choice", when {\n                    nativeSkillReference != null && previousResponseId == null -> JSONObject().put("type", "shell")\n                    forceSkill -> JSONObject().put("type", "function").put("name", LOAD_SKILL_TOOL)\n                    else -> "auto"\n                })'''
          new = '''                body.put("tool_choice", when {\n                    forceSkill -> JSONObject().put("type", "function").put("name", LOAD_SKILL_TOOL)\n                    forceNativeSkill -> JSONObject().put("type", "shell")\n                    else -> "auto"\n                })'''
          if old not in text: raise SystemExit('missing tool choice block')
          text = text.replace(old, new, 1)

          text = text.replace('            if (systemPrompt.isNotBlank()) body.put("instructions", systemPrompt)', '            if (effectiveSystemPrompt.isNotBlank()) body.put("instructions", effectiveSystemPrompt)', 1)

          old = '''            var responseId = ""\n            var usedWebSearch = false\n            val roundCitations'''
          new = '''            var responseId = ""\n            var usedWebSearch = false\n            var usedShell = false\n            val roundCitations'''
          if old not in text: raise SystemExit('missing round vars')
          text = text.replace(old, new, 1)

          old = '''                            val root = runCatching { JSONObject(payload) }.getOrNull() ?: return@readSsePayloads true\n                            toolAccumulator.accept(root)\n                            parseCitations(root).forEach { roundCitations[it.url] = it }'''
          new = '''                            val root = runCatching { JSONObject(payload) }.getOrNull() ?: return@readSsePayloads true\n                            toolAccumulator.accept(root)\n                            parseCitations(root).forEach { roundCitations[it.url] = it }\n                            if (nativeSkillReference != null && responseUsedShell(root)) {\n                                if (!usedShell) recordActivity(ChatToolActivity(\n                                    "native_skill_use", LOAD_SKILL_TOOL,\n                                    "正在调用原生 Skill：${nativeSkillReference.name}", TOOL_STATUS_RUNNING\n                                ))\n                                usedShell = true\n                            }'''
          # Only replace the Responses occurrence, which is after streamResponses declaration.
          idx = text.index('    private suspend fun streamResponses(')
          tail = text[idx:]
          if old not in tail: raise SystemExit('missing responses SSE root block')
          tail = tail.replace(old, new, 1)
          text = text[:idx] + tail

          old = '''                                    usedWebSearch = usedWebSearch || responseUsedWebSearch(root)\n                                    completed = true'''
          new = '''                                    usedWebSearch = usedWebSearch || responseUsedWebSearch(root)\n                                    usedShell = usedShell || responseUsedShell(root)\n                                    if (usedShell && nativeSkillReference != null) recordActivity(ChatToolActivity(\n                                        "native_skill_use", LOAD_SKILL_TOOL,\n                                        "已调用原生 Skill：${nativeSkillReference.name}", TOOL_STATUS_COMPLETED\n                                    ))\n                                    completed = true'''
          if old not in text[idx:]: raise SystemExit('missing response.completed block')
          tail = text[idx:].replace(old, new, 1)
          text = text[:idx] + tail

          old = '''                        usedWebSearch = responseUsedWebSearch(root)\n                        val result = runCatching { parseResponsesText(root) }.getOrDefault("")'''
          new = '''                        usedWebSearch = responseUsedWebSearch(root)\n                        usedShell = responseUsedShell(root)\n                        if (usedShell && nativeSkillReference != null) recordActivity(ChatToolActivity(\n                            "native_skill_use", LOAD_SKILL_TOOL,\n                            "已调用原生 Skill：${nativeSkillReference.name}", TOOL_STATUS_COMPLETED\n                        ))\n                        val result = runCatching { parseResponsesText(root) }.getOrDefault("")'''
          if old not in text[idx:]: raise SystemExit('missing non-streaming response block')
          tail = text[idx:].replace(old, new, 1)
          text = text[:idx] + tail

          old = '            return ProtocolRoundResult(roundText.toString(), roundUsage, calls, roundCitations.values.toList(), responseId, usedWebSearch)'
          new = '            return ProtocolRoundResult(roundText.toString(), roundUsage, calls, roundCitations.values.toList(), responseId, usedWebSearch, usedShell)'
          if old not in text[idx:]: raise SystemExit('missing ProtocolRoundResult return')
          tail = text[idx:].replace(old, new, 1)
          text = text[:idx] + tail

          old = '''        var requestInput = initialInput\n        var previousResponseId: String? = null\n        var completedNormally = false\n        for (toolRound in 0 until MAX_TOOL_ROUNDS) {\n            val round = executeRound(requestInput, previousResponseId, skillLoadingEnabled && toolRound == 0)'''
          new = '''        var requestInput = initialInput\n        var previousResponseId: String? = null\n        var completedNormally = false\n        var skillFunctionCompleted = !skillLoadingEnabled\n        var nativeSkillInvoked = nativeSkillReference == null\n        for (toolRound in 0 until MAX_TOOL_ROUNDS) {\n            val forceSkill = !skillFunctionCompleted\n            val forceNativeSkill = skillFunctionCompleted && !nativeSkillInvoked\n            val round = executeRound(requestInput, previousResponseId, forceSkill, forceNativeSkill)\n            if (forceNativeSkill && !round.usedShell) {\n                throw IllegalStateException("Skill shell was forced but the provider did not execute it")\n            }\n            if (round.usedShell) nativeSkillInvoked = true'''
          if old not in text: raise SystemExit('missing responses loop start')
          text = text.replace(old, new, 1)

          old = '''                val execution = executeAppTool(call, skillLoader)\n                execution.generatedFile?.let(generatedFiles::add)\n                recordActivity(execution.activity)\n                requestInput.put(JSONObject()'''
          new = '''                val execution = executeAppTool(call, skillLoader)\n                execution.generatedFile?.let(generatedFiles::add)\n                recordActivity(execution.activity)\n                if (call.name == LOAD_SKILL_TOOL && runCatching { JSONObject(execution.output).optBoolean("ok") }.getOrDefault(false)) {\n                    skillFunctionCompleted = true\n                }\n                requestInput.put(JSONObject()'''
          if old not in text[idx:]: raise SystemExit('missing execution block')
          tail = text[idx:].replace(old, new, 1)
          text = text[:idx] + tail

          old = '''            "unsupported", "not supported", "does not support", "unknown tool",\n            "invalid tool", "not available", "not allowed", "unrecognized",'''
          new = '''            "unsupported", "not supported", "does not support", "unknown tool",\n            "invalid tool", "not available", "not allowed", "unrecognized", "did not execute",'''
          if old not in text: raise SystemExit('missing compatibility list')
          text = text.replace(old, new, 1)
          api.write_text(text)

          # Rewrite the key native contract test: first load_skill must return actual SKILL.md,
          # then the second request must force/observe hosted shell use.
          test = Path('app/src/test/java/com/adong/adchat/data/NativeSkillsTest.kt')
          t = test.read_text()
          start = t.index('    @Test\n    fun responsesRouteUsesActualNativeUploadedSkillReference()')
          end = t.index('    @Test\n    fun unsupportedNativeSkillsFallsBackToRealFunctionToolRoundTrip()', start)
          replacement = r'''    @Test
    fun responsesRouteLoadsSkillContentThenActuallyInvokesNativeShell() = runBlocking {
        val server = MockWebServer()
        server.start()
        try {
            val sourceUrl = "https://github.com/example/slides/tree/main/presentation"
            var bundled = 0
            var uploaded = 0
            var functionLoads = 0
            val bundleLoader = SkillBundleLoader { url ->
                bundled++
                assertEquals(sourceUrl, url)
                bundle(url)
            }
            val uploader = NativeSkillUploader { _, skillBundle ->
                uploaded++
                assertEquals("bundle-sha", skillBundle.sha256)
                NativeSkillReference("skill_real_123", "3", skillBundle.name, skillBundle.sha256)
            }
            val repository = ApiRepository(
                skillLoader = SkillLoader { url ->
                    functionLoads++
                    LoadedSkill(
                        name = "presentation-design",
                        sourceUrl = url,
                        resolvedUrl = "https://raw.githubusercontent.com/example/slides/main/presentation/SKILL.md",
                        sha256 = "skill-md-sha",
                        content = "# ACTUAL NATIVE SKILL\nUse the presentation design rules."
                    )
                },
                skillBundleLoader = bundleLoader,
                nativeSkillUploader = uploader
            )
            server.enqueue(MockResponse().setHeader("Content-Type", "application/json").setBody(
                """{"id":"resp-load","status":"completed","output":[{"type":"function_call","id":"item-load","call_id":"call-load","name":"load_skill","arguments":"{\"url\":\"$sourceUrl\"}"}]}"""
            ))
            server.enqueue(MockResponse().setHeader("Content-Type", "application/json").setBody(
                """{"id":"resp-native","status":"completed","output":[{"type":"shell_call","id":"shell-1","call_id":"shell-call","status":"completed","action":{"commands":["cat /skills/presentation-design/SKILL.md"]}},{"type":"message","content":[{"type":"output_text","text":"已按 Skill 完成"}]}]}"""
            ))

            val result = repository.streamChat(
                profile = ApiProfile(baseUrl = server.url("/").toString(), apiKey = "test", chatApiMode = "responses"),
                model = "gpt-test",
                systemPrompt = "",
                history = listOf(ChatMessage(role = "user", content = "请加载并使用这个 skill：$sourceUrl")),
                cacheKey = "native-skill"
            ) {}

            assertEquals(1, bundled)
            assertEquals(1, uploaded)
            assertEquals(1, functionLoads)
            assertEquals("已按 Skill 完成", result.text)

            val first = JSONObject(server.takeRequest().body.readUtf8())
            assertEquals(LOAD_SKILL_TOOL, first.getJSONObject("tool_choice").getString("name"))
            assertTrue(first.getJSONArray("tools").toString().contains("\"name\":\"load_skill\""))
            val shell = (0 until first.getJSONArray("tools").length())
                .map { first.getJSONArray("tools").getJSONObject(it) }
                .first { it.optString("type") == "shell" }
            val skill = shell.getJSONObject("environment").getJSONArray("skills").getJSONObject(0)
            assertEquals("skill_real_123", skill.getString("skill_id"))
            assertEquals("3", skill.getString("version"))

            val second = JSONObject(server.takeRequest().body.readUtf8())
            assertEquals("shell", second.getJSONObject("tool_choice").getString("type"))
            val output = JSONObject(second.getJSONArray("input").getJSONObject(0).getString("output"))
            assertEquals("# ACTUAL NATIVE SKILL\nUse the presentation design rules.", output.getString("content"))
            assertEquals("skill-md-sha", output.getString("sha256"))
        } finally {
            server.shutdown()
        }
    }

'''
          t = t[:start] + replacement + t[end:]
          test.write_text(t)

          # Self-remove the one-shot workflow from the resulting commit.
          Path('.github/workflows/skills-invocation-fix.yml').unlink()
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(skills): require real skill invocation evidence"
          git push origin HEAD:feature/skills-runtime
