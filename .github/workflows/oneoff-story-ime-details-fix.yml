name: One-off story IME and details fix

on:
  push:
    branches: [feature/story-mode]
    paths: [.github/workflows/oneoff-story-ime-details-fix.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/story-mode
          fetch-depth: 0
      - name: Apply focused StoryScreen patch
        shell: bash
        run: |
          echo '' | base64 -d | python3
          rm .github/workflows/oneoff-story-ime-details-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/adong/adchat/ui/screens/StoryScreen.kt .github/workflows/oneoff-story-ime-details-fix.yml
          git commit -m "fix(story): follow IME and reveal expanded details"
          git push origin HEAD:feature/story-mode
