name: Skill full-read migration

on:
  push:
    branches:
      - "feature/skills-runtime"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: feature/skills-runtime
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Apply migration
        run: python3 .github/apply-skill-full-read.py

      - name: Validate diff
        run: git diff --check

      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Commit final source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/apply-skill-full-read.py
          rm -f .github/workflows/apply-skill-full-read.yml
          rm -f .github/workflows/skill-full-read-migration.yml
          git show 6cc5edb185757f1820e8406e6e228ab343fa6cc8:.github/workflows/android-build.yml > .github/workflows/android-build.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: read skill files in one pass"
          git push origin HEAD:feature/skills-runtime
