name: Apply IME animation sync

on:
  push:
    branches:
      - fix/icon-ime-collapse
    paths:
      - .github/workflows/apply-ime-animation-sync.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/icon-ime-collapse
          fetch-depth: 0

      - name: Synchronize composer collapse with IME animation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/adong/adchat/ui/screens/ChatScreen.kt")
          text = path.read_text(encoding="utf-8")

          old_setup = """    val focusManager = LocalFocusManager.current\n    val imeInsets = WindowInsets.ime\n    val hazeState = rememberHazeState()\n"""
          new_setup = """    val focusManager = LocalFocusManager.current\n    val imeInsets = WindowInsets.ime\n    val imeAnimationTarget = WindowInsets.imeAnimationTarget\n    val hazeState = rememberHazeState()\n"""
          if old_setup not in text:
              raise SystemExit("IME setup anchor not found")
          text = text.replace(old_setup, new_setup, 1)

          old_effect = """    LaunchedEffect(composerFocused, vm.activeConversationId) {\n        if (!composerFocused) return@LaunchedEffect\n        autoFollow = true\n        var imeWasVisible = imeInsets.getBottom(density) > 0\n        snapshotFlow { imeInsets.getBottom(density) }\n            .distinctUntilChanged()\n            .collect { imeBottom ->\n                if (imeBottom > 0) {\n                    imeWasVisible = true\n                    if (vm.messages.isNotEmpty()) {\n                        listState.scrollToItem(vm.messages.size)\n                    }\n                } else if (imeWasVisible) {\n                    // Android can hide the IME without removing Compose focus.\n                    // Clear it only after a visible -> hidden transition so the\n                    // composer collapses without racing the keyboard opening.\n                    focusManager.clearFocus()\n                }\n            }\n    }\n"""
          new_effect = """    LaunchedEffect(composerFocused, vm.activeConversationId) {\n        if (!composerFocused) return@LaunchedEffect\n        autoFollow = true\n        var imeWasVisible = imeInsets.getBottom(density) > 0\n        snapshotFlow {\n            imeInsets.getBottom(density) to imeAnimationTarget.getBottom(density)\n        }\n            .distinctUntilChanged()\n            .collect { (imeBottom, imeTargetBottom) ->\n                if (imeBottom > 0) {\n                    imeWasVisible = true\n                    if (vm.messages.isNotEmpty()) {\n                        listState.scrollToItem(vm.messages.size)\n                    }\n                }\n\n                if (imeWasVisible && imeTargetBottom == 0) {\n                    // Start collapsing as soon as the system begins the IME close animation.\n                    // Waiting for imeBottom == 0 makes the keyboard and composer animate serially.\n                    focusManager.clearFocus()\n                }\n            }\n    }\n"""
          if old_effect not in text:
              raise SystemExit("IME effect anchor not found")
          text = text.replace(old_effect, new_effect, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit synchronized animation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/adong/adchat/ui/screens/ChatScreen.kt
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Sync composer collapse with IME animation"
          git push origin HEAD:fix/icon-ime-collapse
