name: Apply icon and IME fix

on:
  push:
    branches:
      - fix/icon-ime-collapse
    paths:
      - .github/workflows/apply-icon-ime-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/icon-ime-collapse
          fetch-depth: 0

      - name: Apply focused composer and launcher fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          chat_path = Path("app/src/main/java/com/adong/adchat/ui/screens/ChatScreen.kt")
          text = chat_path.read_text(encoding="utf-8")

          old_setup = """    val scope = rememberCoroutineScope()\n    val density = LocalDensity.current\n    val imeInsets = WindowInsets.ime\n"""
          new_setup = """    val scope = rememberCoroutineScope()\n    val density = LocalDensity.current\n    val focusManager = LocalFocusManager.current\n    val imeInsets = WindowInsets.ime\n"""
          if old_setup not in text:
              raise SystemExit("ChatScreen focus setup anchor not found")
          text = text.replace(old_setup, new_setup, 1)

          old_effect = """    LaunchedEffect(composerFocused, vm.activeConversationId) {\n        if (!composerFocused) return@LaunchedEffect\n        autoFollow = true\n        snapshotFlow { imeInsets.getBottom(density) }\n            .distinctUntilChanged()\n            .collect {\n                if (vm.messages.isNotEmpty()) {\n                    listState.scrollToItem(vm.messages.size)\n                }\n            }\n    }\n"""
          new_effect = """    LaunchedEffect(composerFocused, vm.activeConversationId) {\n        if (!composerFocused) return@LaunchedEffect\n        autoFollow = true\n        var imeWasVisible = imeInsets.getBottom(density) > 0\n        snapshotFlow { imeInsets.getBottom(density) }\n            .distinctUntilChanged()\n            .collect { imeBottom ->\n                if (imeBottom > 0) {\n                    imeWasVisible = true\n                    if (vm.messages.isNotEmpty()) {\n                        listState.scrollToItem(vm.messages.size)\n                    }\n                } else if (imeWasVisible) {\n                    // Android can hide the IME without removing Compose focus.\n                    // Clear it only after a visible -> hidden transition so the\n                    // composer collapses without racing the keyboard opening.\n                    focusManager.clearFocus()\n                }\n            }\n    }\n"""
          if old_effect not in text:
              raise SystemExit("ChatScreen IME effect anchor not found")
          text = text.replace(old_effect, new_effect, 1)
          chat_path.write_text(text, encoding="utf-8")

          drawable = Path("app/src/main/res/drawable")
          drawable.mkdir(parents=True, exist_ok=True)
          safe_inset = """<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<inset xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    android:drawable=\"@drawable/ic_launcher_foreground\"\n    android:insetLeft=\"10dp\"\n    android:insetTop=\"10dp\"\n    android:insetRight=\"10dp\"\n    android:insetBottom=\"10dp\" />\n"""
          safe_mono = """<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<inset xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    android:drawable=\"@drawable/ic_launcher_monochrome\"\n    android:insetLeft=\"10dp\"\n    android:insetTop=\"10dp\"\n    android:insetRight=\"10dp\"\n    android:insetBottom=\"10dp\" />\n"""
          (drawable / "ic_launcher_foreground_safe.xml").write_text(safe_inset, encoding="utf-8")
          (drawable / "ic_launcher_monochrome_safe.xml").write_text(safe_mono, encoding="utf-8")

          launcher_paths = [
              Path("app/src/main/res/mipmap-anydpi/ic_launcher.xml"),
              Path("app/src/main/res/mipmap-anydpi/ic_launcher_round.xml"),
              Path("app/src/main/res/mipmap-anydpi-v33/ic_launcher.xml"),
              Path("app/src/main/res/mipmap-anydpi-v33/ic_launcher_round.xml"),
          ]
          for path in launcher_paths:
              launcher = path.read_text(encoding="utf-8")
              launcher = launcher.replace(
                  '@drawable/ic_launcher_foreground',
                  '@drawable/ic_launcher_foreground_safe',
              )
              if "mipmap-anydpi-v33" in str(path):
                  launcher = launcher.replace(
                      '@drawable/ic_launcher_monochrome',
                      '@drawable/ic_launcher_monochrome_safe',
                  )
              path.write_text(launcher, encoding="utf-8")
          PY

      - name: Commit fixes to development branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/adong/adchat/ui/screens/ChatScreen.kt app/src/main/res
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Fix launcher safe area and collapse composer with IME"
          git push origin HEAD:fix/icon-ime-collapse
