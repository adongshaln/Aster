name: Wire native skills

on:
  push:
    branches: [feature/skills-runtime]
    paths:
      - '.github/workflows/wire-native-skills.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/skills-runtime
      - name: Patch repository
        run: python3 .github/scripts/wire_native_skills.py
      - name: Commit product code
        run: |
          rm .github/workflows/wire-native-skills.yml
          rm .github/scripts/wire_native_skills.py
          rm -f .github/workflows/native-skills-wire.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(skills): use native Skills API in Responses"
          git push origin HEAD:feature/skills-runtime
