name: Implement skills runtime

on:
  push:
    branches: ["feature/skills-runtime"]
    paths:
      - ".github/workflows/implement-skills-runtime.yml"

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/skills-runtime
      - name: Apply implementation
        run: python tools/implement_skills_runtime.py
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(skills): load GitHub skills through real tool calls"
          git push origin HEAD:feature/skills-runtime
