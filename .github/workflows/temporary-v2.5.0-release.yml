name: Temporary Aster v2.5.0 release trigger

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create v2.5.0 tag on the verified commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: e425e395b4b796482b6192639e91b496f332b058
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v2.5.0" >/dev/null 2>&1; then
            echo "v2.5.0 already exists"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/v2.5.0" \
              -f sha="${TARGET_SHA}"
          fi
