name: Apply IME follow scroll fix

on:
  push:
    branches:
      - fix/icon-ime-collapse
    paths:
      - .github/workflows/apply-ime-follow-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/icon-ime-collapse
          fetch-depth: 0

      - name: Restore IME follow scrolling
        shell: bash
        run: |
          printf '%s' '' | base64 --decode > /tmp/ime_follow_fix.py
          python3 /tmp/ime_follow_fix.py

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/adong/adchat/ui/screens/ChatScreen.kt
          git commit -m "Restore IME follow scrolling"
          git push origin HEAD:fix/icon-ime-collapse
