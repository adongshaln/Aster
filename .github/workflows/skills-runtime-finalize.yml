name: Finalize skills runtime

on:
  push:
    branches:
      - feature/skills-runtime

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/skills-runtime
          fetch-depth: 0
      - name: Apply runtime patch
        run: |
          python scripts/finalize_skills_runtime.py
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/adong/adchat/data/SkillRuntime.kt')
          s = p.read_text()
          if 'internal fun shouldOfferSkillLoader' not in s:
              anchor = 'internal fun requestedInstalledSkillName('
              helper = 'internal fun shouldOfferSkillLoader(history: List<ChatMessage>): Boolean = requestedGitHubSkillUrl(history) != null\n\n'
              if anchor not in s:
                  raise SystemExit('missing installed skill helper anchor')
              s = s.replace(anchor, helper + anchor, 1)
              p.write_text(s)
          PY
      - name: Remove one-off patch files
        run: rm -f scripts/finalize_skills_runtime.py .github/workflows/skills-runtime-finalize.yml
      - name: Test and assemble release
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleRelease
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(skills): complete persistent function-call runtime"
          git push origin HEAD:feature/skills-runtime
