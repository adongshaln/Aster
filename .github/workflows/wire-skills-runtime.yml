name: Wire skills runtime
on:
  push:
    branches: [feature/skills-runtime]
    paths: ['.github/workflows/wire-skills-runtime.yml']
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/skills-runtime
      - name: Wire real load_skill tool
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing patch anchor: {label}')
              return text.replace(old, new, 1)

          tp = Path('app/src/main/java/com/adong/adchat/data/ToolProtocol.kt')
          s = tp.read_text()
          s = replace_once(s, 'internal const val MAX_TOOL_ROUNDS = 4', 'internal const val MAX_TOOL_ROUNDS = 8', 'tool rounds')
          old = '''internal data class ChatToolPolicy(\n    val webSearchEnabled: Boolean,\n    val fileCreationEnabled: Boolean\n)\n\ninternal fun resolveChatToolPolicy(\n    webSearchEnabled: Boolean,\n    fileCreationEnabled: Boolean\n): ChatToolPolicy = if (webSearchEnabled) {\n    // Chat search models commonly use web_search_options and frequently reject\n    // custom function tools in the same request. The explicit search choice wins.\n    ChatToolPolicy(webSearchEnabled = true, fileCreationEnabled = false)\n} else {\n    ChatToolPolicy(webSearchEnabled = false, fileCreationEnabled = fileCreationEnabled)\n}\n\ninternal fun buildChatTools(fileCreationEnabled: Boolean): JSONArray = JSONArray().apply {\n    if (fileCreationEnabled) {\n        put(JSONObject()\n            .put("type", "function")\n            .put("function", createFileDefinition(responsesApi = false)))\n    }\n}\n\ninternal fun buildResponsesTools(\n    fileCreationEnabled: Boolean,\n    webSearchEnabled: Boolean\n): JSONArray = JSONArray().apply {\n    if (webSearchEnabled) put(JSONObject().put("type", WEB_SEARCH_TOOL))\n    if (fileCreationEnabled) put(createFileDefinition(responsesApi = true))\n}\n'''
          new = '''internal data class ChatToolPolicy(\n    val webSearchEnabled: Boolean,\n    val fileCreationEnabled: Boolean,\n    val skillLoadingEnabled: Boolean\n)\n\ninternal fun resolveChatToolPolicy(\n    webSearchEnabled: Boolean,\n    fileCreationEnabled: Boolean,\n    skillLoadingEnabled: Boolean = false\n): ChatToolPolicy = when {\n    // A requested Skill must use a real custom function call. Some Chat-compatible\n    // gateways reject custom tools together with web_search_options, so Skill loading wins.\n    skillLoadingEnabled -> ChatToolPolicy(false, fileCreationEnabled, true)\n    webSearchEnabled -> ChatToolPolicy(true, false, false)\n    else -> ChatToolPolicy(false, fileCreationEnabled, false)\n}\n\ninternal fun buildChatTools(\n    fileCreationEnabled: Boolean,\n    skillLoadingEnabled: Boolean = false\n): JSONArray = JSONArray().apply {\n    if (fileCreationEnabled) {\n        put(JSONObject()\n            .put("type", "function")\n            .put("function", createFileDefinition(responsesApi = false)))\n    }\n    if (skillLoadingEnabled) {\n        put(JSONObject()\n            .put("type", "function")\n            .put("function", loadSkillDefinition(responsesApi = false)))\n    }\n}\n\ninternal fun buildResponsesTools(\n    fileCreationEnabled: Boolean,\n    webSearchEnabled: Boolean,\n    skillLoadingEnabled: Boolean = false\n): JSONArray = JSONArray().apply {\n    if (webSearchEnabled) put(JSONObject().put("type", WEB_SEARCH_TOOL))\n    if (fileCreationEnabled) put(createFileDefinition(responsesApi = true))\n    if (skillLoadingEnabled) put(loadSkillDefinition(responsesApi = true))\n}\n'''
          s = replace_once(s, old, new, 'tool policy')
          anchor = 'internal class ChatToolCallAccumulator {'
          definition = '''private fun loadSkillDefinition(responsesApi: Boolean): JSONObject {\n    val parameters = JSONObject()\n        .put("type", "object")\n        .put("properties", JSONObject()\n            .put("source_url", JSONObject()\n                .put("type", "string")\n                .put("description", "Public GitHub repository, tree directory, blob/SKILL.md or raw/SKILL.md HTTPS URL supplied by the user.")))\n        .put("required", JSONArray(listOf("source_url")))\n        .put("additionalProperties", false)\n    val definition = JSONObject()\n        .put("name", LOAD_SKILL_TOOL)\n        .put("description", "Load the real SKILL.md from a public GitHub link. Aster performs an actual HTTPS fetch, validates the target and returns the exact Skill text plus its resolved URL and SHA-256. When the user asks to load, add, install, use or reference a GitHub Skill, call this tool instead of claiming that Skill tools are unavailable or merely paraphrasing the link.")\n        .put("parameters", parameters)\n    return if (responsesApi) definition.put("type", "function").put("strict", true) else definition\n}\n\n'''
          if anchor not in s: raise SystemExit('missing accumulator anchor')
          s = s.replace(anchor, definition + anchor, 1)
          start = s.index('internal fun executeAppTool(')
          end = s.index('\ninternal fun parseCitations', start)
          replacement = '''internal fun executeAppTool(\n    call: PendingToolCall,\n    skillLoader: SkillLoader = GitHubSkillRuntime,\n    forcedSkillSourceUrl: String? = null\n): ToolExecutionResult = when (call.name) {\n    LOAD_SKILL_TOOL -> runCatching {\n        val arguments = JSONObject(call.arguments)\n        val sourceUrl = forcedSkillSourceUrl?.takeIf(String::isNotBlank)\n            ?: arguments.optString("source_url").trim()\n        require(sourceUrl.isNotBlank()) { "load_skill 缺少 source_url" }\n        val loaded = skillLoader.load(sourceUrl)\n        ToolExecutionResult(\n            output = JSONObject()\n                .put("ok", true)\n                .put("type", "skill")\n                .put("name", loaded.name)\n                .put("source_url", loaded.sourceUrl)\n                .put("resolved_url", loaded.resolvedUrl)\n                .put("sha256", loaded.sha256)\n                .put("content", loaded.content)\n                .toString(),\n            activity = ChatToolActivity(call.callId, LOAD_SKILL_TOOL, "已加载 Skill：${loaded.name}", TOOL_STATUS_COMPLETED)\n        )\n    }.getOrElse { error ->\n        ToolExecutionResult(\n            output = JSONObject().put("ok", false).put("error", error.message ?: "Skill 加载失败").toString(),\n            activity = ChatToolActivity(call.callId, LOAD_SKILL_TOOL, error.message ?: "Skill 加载失败", TOOL_STATUS_FAILED)\n        )\n    }\n    CREATE_FILE_TOOL -> runCatching {\n        val arguments = JSONObject(call.arguments)\n        val mimeType = arguments.optString("mime_type")\n        require(mimeType in MIME_EXTENSIONS) { "不支持的文件类型" }\n        val content = arguments.optString("content")\n        val filename = sanitizeFileName(arguments.optString("filename"), mimeType)\n        val file = if (mimeType in DocumentFiles.extensions) DocumentFiles.create(filename, mimeType, content)\n            else GeneratedFileDraft(name = filename, mimeType = mimeType, content = content)\n        ToolExecutionResult(\n            output = JSONObject()\n                .put("ok", true)\n                .put("filename", file.name)\n                .put("mime_type", file.mimeType)\n                .put("size_bytes", ChatFileAttachment(name = file.name, mimeType = file.mimeType, content = file.content, encoding = file.encoding).sizeBytes)\n                .toString(),\n            generatedFile = file,\n            activity = ChatToolActivity(call.callId, CREATE_FILE_TOOL, "已创建 ${file.name}", TOOL_STATUS_COMPLETED)\n        )\n    }.getOrElse { error ->\n        ToolExecutionResult(\n            output = JSONObject().put("ok", false).put("error", error.message ?: "文件创建失败").toString(),\n            activity = ChatToolActivity(call.callId, CREATE_FILE_TOOL, error.message ?: "文件创建失败", TOOL_STATUS_FAILED)\n        )\n    }\n    else -> ToolExecutionResult(\n        output = JSONObject().put("ok", false).put("error", "Unsupported tool: ${call.name}").toString(),\n        activity = ChatToolActivity(call.callId, call.name, "工具 ${call.name} 不受支持", TOOL_STATUS_FAILED)\n    )\n}\n'''
          s = s[:start] + replacement + s[end:]
          tp.write_text(s)

          api = Path('app/src/main/java/com/adong/adchat/data/ApiRepository.kt')
          s = api.read_text()
          s = replace_once(s, 'class ApiRepository {', 'class ApiRepository(private val skillLoader: SkillLoader = GitHubSkillRuntime) {', 'repository constructor')
          s = replace_once(s, '        val toolsActive = profile.webSearchEnabled || profile.fileCreationEnabled\n        val initialContext = ModelContextPolicy.prepare(systemPrompt, history, profile.contextLimits(model), trimHistory)', '        val skillSourceUrl = requestedGitHubSkillUrl(history)\n        val toolsActive = profile.webSearchEnabled || profile.fileCreationEnabled || skillSourceUrl != null\n        val initialContext = ModelContextPolicy.prepare(systemPrompt, history, profile.contextLimits(model), trimHistory)', 'skill detection')
          s = replace_once(s, 'streamResponses(profile, model, systemPrompt, prepared.history, cacheKey, onToolActivity, deltaSink)', 'streamResponses(profile, model, systemPrompt, prepared.history, cacheKey, skillSourceUrl, onToolActivity, deltaSink)', 'responses call')
          s = replace_once(s, 'streamChatCompletions(profile, model, systemPrompt, prepared.history, cacheKey, explicitCache = false, onToolActivity = onToolActivity, onDelta = deltaSink)', 'streamChatCompletions(profile, model, systemPrompt, prepared.history, cacheKey, explicitCache = false, skillSourceUrl = skillSourceUrl, onToolActivity = onToolActivity, onDelta = deltaSink)', 'chat call')
          s = replace_once(s, '        explicitCache: Boolean,\n        onToolActivity: suspend (ChatToolActivity) -> Unit,', '        explicitCache: Boolean,\n        skillSourceUrl: String?,\n        onToolActivity: suspend (ChatToolActivity) -> Unit,', 'chat signature')
          s = replace_once(s, '            val toolPolicy = resolveChatToolPolicy(profile.webSearchEnabled, profile.fileCreationEnabled)', '            val toolPolicy = resolveChatToolPolicy(profile.webSearchEnabled, profile.fileCreationEnabled, skillSourceUrl != null)', 'chat policy call')
          s = replace_once(s, '            val tools = buildChatTools(toolPolicy.fileCreationEnabled)\n            if (tools.length() > 0) body.put("tools", tools).put("tool_choice", "auto")', '''            val tools = buildChatTools(toolPolicy.fileCreationEnabled, toolPolicy.skillLoadingEnabled)\n            if (tools.length() > 0) {\n                body.put("tools", tools)\n                val hasToolResult = (0 until messages.length()).any { messages.optJSONObject(it)?.optString("role") == "tool" }\n                if (skillSourceUrl != null && !hasToolResult) {\n                    body.put("tool_choice", JSONObject()\n                        .put("type", "function")\n                        .put("function", JSONObject().put("name", LOAD_SKILL_TOOL)))\n                } else body.put("tool_choice", "auto")\n            }''', 'chat tool choice')
          old_exec = '''                recordActivity(ChatToolActivity(call.callId, call.name, "正在创建文件", TOOL_STATUS_RUNNING))\n                val execution = executeAppTool(call)'''
          new_exec = '''                val runningLabel = if (call.name == LOAD_SKILL_TOOL) "正在加载 Skill" else "正在创建文件"\n                recordActivity(ChatToolActivity(call.callId, call.name, runningLabel, TOOL_STATUS_RUNNING))\n                val execution = executeAppTool(call, skillLoader, if (call.name == LOAD_SKILL_TOOL) skillSourceUrl else null)'''
          s = replace_once(s, old_exec, new_exec, 'chat execution')
          s = replace_once(s, '        cacheKey: String,\n        onToolActivity: suspend (ChatToolActivity) -> Unit,', '        cacheKey: String,\n        skillSourceUrl: String?,\n        onToolActivity: suspend (ChatToolActivity) -> Unit,', 'responses signature')
          s = replace_once(s, '        val tools = buildResponsesTools(profile.fileCreationEnabled, profile.webSearchEnabled)', '        val tools = buildResponsesTools(profile.fileCreationEnabled, profile.webSearchEnabled, skillSourceUrl != null)', 'responses tools')
          s = replace_once(s, '            if (tools.length() > 0) body.put("tools", tools).put("tool_choice", "auto")\n            if (profile.fileCreationEnabled) body.put("store", true)', '''            if (tools.length() > 0) {\n                body.put("tools", tools)\n                if (skillSourceUrl != null && previousResponseId == null) {\n                    body.put("tool_choice", JSONObject().put("type", "function").put("name", LOAD_SKILL_TOOL))\n                } else body.put("tool_choice", "auto")\n            }\n            if (profile.fileCreationEnabled || skillSourceUrl != null) body.put("store", true)''', 'responses tool choice')
          s = replace_once(s, old_exec, new_exec, 'responses execution')
          api.write_text(s)

          test = Path('app/src/test/java/com/adong/adchat/data/ToolProtocolTest.kt')
          s = test.read_text()
          insert = '''\n    @Test\n    fun skillLoaderIsExposedAsARealFunctionTool() {\n        val chat = buildChatTools(fileCreationEnabled = false, skillLoadingEnabled = true)\n        assertEquals(LOAD_SKILL_TOOL, chat.getJSONObject(0).getJSONObject("function").getString("name"))\n        val responses = buildResponsesTools(fileCreationEnabled = false, webSearchEnabled = false, skillLoadingEnabled = true)\n        assertEquals(LOAD_SKILL_TOOL, responses.getJSONObject(0).getString("name"))\n    }\n\n    @Test\n    fun loadSkillExecutesLoaderAndReturnsExactDownloadedContent() {\n        var loadedUrl = ""\n        val loader = SkillLoader { url ->\n            loadedUrl = url\n            LoadedSkill("demo-skill", url, "https://raw.githubusercontent.com/acme/demo/main/SKILL.md", "abc123", "# REAL_SKILL_SENTINEL\\nFollow these instructions.")\n        }\n        val source = "https://github.com/acme/demo/blob/main/SKILL.md"\n        val result = executeAppTool(\n            PendingToolCall("item-skill", "call-skill", LOAD_SKILL_TOOL, JSONObject().put("source_url", "https://github.com/wrong/repo").toString()),\n            loader,\n            forcedSkillSourceUrl = source\n        )\n        assertEquals(source, loadedUrl)\n        assertEquals(TOOL_STATUS_COMPLETED, result.activity.status)\n        val output = JSONObject(result.output)\n        assertTrue(output.getBoolean("ok"))\n        assertEquals("demo-skill", output.getString("name"))\n        assertTrue(output.getString("content").contains("REAL_SKILL_SENTINEL"))\n    }\n\n    @Test\n    fun explicitGitHubSkillRequestIsDetectedWithoutTreatingEveryGitHubLinkAsASkill() {\n        val source = "https://github.com/acme/demo"\n        assertEquals(source, requestedGitHubSkillUrl(listOf(ChatMessage(role = "user", content = "请加载这个 skill $source"))))\n        assertEquals(null, requestedGitHubSkillUrl(listOf(ChatMessage(role = "user", content = "看看这个仓库 $source"))))\n    }\n'''
          pos = s.rfind('\n}')
          if pos < 0: raise SystemExit('missing ToolProtocolTest class end')
          test.write_text(s[:pos] + insert + s[pos:])

          contract = Path('app/src/test/java/com/adong/adchat/data/StoryCompletionContractTest.kt')
          s = contract.read_text()
          insert = r'''\n    @Test fun githubSkillToolPerformsRealToolRoundInBothProtocols() = runBlocking {\n        val server = MockWebServer(); server.start()\n        try {\n            val source = "https://github.com/acme/demo/blob/main/SKILL.md"\n            val loader = SkillLoader { url -> LoadedSkill("demo", url, "https://raw.githubusercontent.com/acme/demo/main/SKILL.md", "deadbeef", "# REAL_SKILL_SENTINEL") }\n            val repository = ApiRepository(loader)\n\n            server.enqueue(MockResponse().setHeader("Content-Type", "application/json").setBody(\n                """{"choices":[{"message":{"content":null,"tool_calls":[{"id":"call-skill-chat","type":"function","function":{"name":"load_skill","arguments":"{\\"source_url\\":\\"$source\\"}"}}]},"finish_reason":"tool_calls"}]}"""))\n            server.enqueue(MockResponse().setHeader("Content-Type", "application/json").setBody(\n                """{"choices":[{"message":{"content":"已使用 Skill"},"finish_reason":"stop"}]}"""))\n            repository.streamChat(\n                ApiProfile(baseUrl = server.url("/").toString(), apiKey = "test", chatApiMode = "chat"),\n                "gemini-test", "", listOf(ChatMessage(role = "user", content = "请加载并使用这个 skill $source")), "skill-chat"\n            ) {}\n            val chatFirst = JSONObject(server.takeRequest().body.readUtf8())\n            assertEquals(LOAD_SKILL_TOOL, chatFirst.getJSONObject("tool_choice").getJSONObject("function").getString("name"))\n            val chatSecond = server.takeRequest().body.readUtf8()\n            assertTrue(chatSecond.contains("REAL_SKILL_SENTINEL"))\n            assertTrue(chatSecond.contains("\\\"role\\\":\\\"tool\\\""))\n\n            server.enqueue(MockResponse().setHeader("Content-Type", "application/json").setBody(\n                """{"id":"r-skill","status":"completed","output":[{"id":"item-skill","type":"function_call","call_id":"call-skill-responses","name":"load_skill","arguments":"{\\"source_url\\":\\"$source\\"}"}]}"""))\n            server.enqueue(MockResponse().setHeader("Content-Type", "application/json").setBody(\n                """{"id":"r-final","status":"completed","output":[{"type":"message","content":[{"type":"output_text","text":"已使用 Skill"}]}]}"""))\n            repository.streamChat(\n                ApiProfile(baseUrl = server.url("/").toString(), apiKey = "test"),\n                "gpt-test", "", listOf(ChatMessage(role = "user", content = "请加载并使用这个 skill $source")), "skill-responses"\n            ) {}\n            val responsesFirst = JSONObject(server.takeRequest().body.readUtf8())\n            assertEquals(LOAD_SKILL_TOOL, responsesFirst.getJSONObject("tool_choice").getString("name"))\n            val responsesSecond = server.takeRequest().body.readUtf8()\n            assertTrue(responsesSecond.contains("REAL_SKILL_SENTINEL"))\n            assertTrue(responsesSecond.contains("function_call_output"))\n        } finally { server.shutdown() }\n    }\n'''.replace('\\n','\n')
          pos = s.rfind('\n}')
          if pos < 0: raise SystemExit('missing contract class end')
          contract.write_text(s[:pos] + insert + s[pos:])

          skilltest = Path('app/src/test/java/com/adong/adchat/data/SkillRuntimeTest.kt')
          skilltest.write_text('''package com.adong.adchat.data\n\nimport org.junit.Assert.assertEquals\nimport org.junit.Test\n\nclass SkillRuntimeTest {\n    @Test fun resolvesRepositoryBlobTreeAndRawLinksToSkillMd() {\n        val root = resolveGitHubSkillTarget("https://github.com/acme/demo") { _, _ -> "trunk" }\n        assertEquals("https://raw.githubusercontent.com/acme/demo/trunk/SKILL.md", root.rawUrl)\n\n        val blob = resolveGitHubSkillTarget("https://github.com/acme/demo/blob/main/skills/ppt/SKILL.md") { _, _ -> error("unused") }\n        assertEquals("https://raw.githubusercontent.com/acme/demo/main/skills/ppt/SKILL.md", blob.rawUrl)\n\n        val tree = resolveGitHubSkillTarget("https://github.com/acme/demo/tree/main/skills/ppt") { _, _ -> error("unused") }\n        assertEquals("https://raw.githubusercontent.com/acme/demo/main/skills/ppt/SKILL.md", tree.rawUrl)\n\n        val raw = resolveGitHubSkillTarget("https://raw.githubusercontent.com/acme/demo/main/SKILL.md") { _, _ -> error("unused") }\n        assertEquals("https://raw.githubusercontent.com/acme/demo/main/SKILL.md", raw.rawUrl)\n    }\n}\n''')

          doc = Path('docs/SKILLS_RUNTIME.md')
          doc.write_text('''# Aster Skills Runtime\n\nAster 2.4.x development branch now contains a real `load_skill` application tool.\n\n## Execution contract\n\n1. The latest user turn explicitly asks to load/use/add a Skill and contains a public GitHub link.\n2. Aster adds `load_skill` to the actual Chat Completions or Responses `tools` payload.\n3. For the first round Aster forces `tool_choice` to `load_skill`; the model cannot replace the call with prose.\n4. Aster resolves repository/tree/blob/raw links to a real `SKILL.md`, performs an HTTPS download, validates host/size/UTF-8, and computes SHA-256.\n5. The exact downloaded Skill text is returned as the function/tool result.\n6. Only after that result is in protocol context does the model continue its next inference round.\n\nThis is not prompt-only simulation. If the provider does not support function tools, the API request is expected to fail visibly rather than pretending that a Skill was loaded.\n\nCurrent scope is **Skill loading and instruction use**. A Skill that references local scripts, package installation, shell commands or other executors does not gain those capabilities automatically; those require separately implemented Aster tools.\n''')
      - name: Commit implementation and remove one-off workflow
        shell: bash
        run: |
          rm .github/workflows/wire-skills-runtime.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/adong/adchat/data/ToolProtocol.kt app/src/main/java/com/adong/adchat/data/ApiRepository.kt app/src/test/java/com/adong/adchat/data/ToolProtocolTest.kt app/src/test/java/com/adong/adchat/data/StoryCompletionContractTest.kt app/src/test/java/com/adong/adchat/data/SkillRuntimeTest.kt docs/SKILLS_RUNTIME.md .github/workflows/wire-skills-runtime.yml
          git commit -m 'feat(skills): wire real GitHub skill tool calls'
          git push origin HEAD:feature/skills-runtime
