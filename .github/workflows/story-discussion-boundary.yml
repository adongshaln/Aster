name: Apply story discussion boundary

on:
  push:
    branches: ["feature/skills-runtime"]
    paths:
      - ".github/workflows/story-discussion-boundary.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: feature/skills-runtime

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Apply discussion boundary
        run: python3 .github/scripts/apply-story-discussion-boundary.py

      - name: Verify diff
        run: git diff --check

      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Commit final source and remove migration files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/apply-story-discussion-boundary.py .github/workflows/story-discussion-boundary.yml
          git add app/src/main/java/com/adong/adchat/data/story/StoryContextComposer.kt \
                  app/src/test/java/com/adong/adchat/data/story/StoryDiscussionWorkspaceBoundaryTest.kt \
                  docs/STORY_MODE_PROGRESS.md
          git commit -m "fix: prevent prose generation in story discussion"
          git push origin HEAD:feature/skills-runtime
